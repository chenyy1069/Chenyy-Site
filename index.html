<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ChenYY🌀's Site</title>
    <meta name="description" content="Hi! Welcome to ChenYY🌀's site!">
    <meta name="theme-color" content="#f4f1e9">
    <meta property="og:title" content="ChenYY🌀's Site">
    <meta property="og:description" content="Hi! Welcome to ChenYY🌀's site!">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script>
      // Set the theme before first paint: a saved choice wins, otherwise follow the system.
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('chenyy-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        // Assemble the page on the first visit of a session.
        try {
          var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (!calm && !sessionStorage.getItem('chenyy-entered')) {
            document.documentElement.classList.add('is-entering');
            sessionStorage.setItem('chenyy-entered', '1');
          }
        } catch (e) {}
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#20221d');
      })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
